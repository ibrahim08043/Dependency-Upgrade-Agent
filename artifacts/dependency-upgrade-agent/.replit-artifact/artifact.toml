kind = "web"
previewPath = "/"
title = "Dependency Upgrade Agent"
description = "An AI-assisted dependency migration workspace that imports JavaScript and TypeScript repositories, analyzes upgrade impact, runs real migrations and verification in isolated workspaces, and presents the actual diff and report for approval."
version = "1.0.0"
id = "artifacts/dependency-upgrade-agent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24132

[services.development]
run = "pnpm --filter @workspace/dependency-upgrade-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dependency-upgrade-agent", "run", "build" ]
serve = "static"
publicDir = "artifacts/dependency-upgrade-agent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24132"
BASE_PATH = "/"
